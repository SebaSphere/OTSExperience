services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: NEOFORGE
      VERSION: 1.21.1
      NEOFORGE_VERSION: latest
      PACKWIZ_URL: https://raw.githubusercontent.com/SebaSphere/OTSExperience/refs/heads/master/pack.toml
    volumes:
      # attach the relative directory 'data' to the container's /data path
      - ./data:/data